name: Build Linux

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SOA_ACTIONS_ENABLED != 'false' && vars.SOA_LINUX_ENABLED != 'false') }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC / AppImage
            cpp_compiler: g++
          - name: Linux Clang
            cpp_compiler: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check translation catalogues
        if: matrix.cpp_compiler == 'g++'
        run: python3 tools/i18n/filter-translatable.py --check translations/*.ts

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            desktop-file-utils \
            file \
            gcc-mingw-w64-i686 \
            g++-mingw-w64-i686 \
            libfuse2 \
            libgl1-mesa-dev \
            libwayland-dev \
            libxcb-cursor0 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            ninja-build \
            patchelf \
            jq \
            libssl-dev \
            wget \
            xvfb

      - name: Install pinned Linux Swift toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a
        with:
          swift-version: "6.3.2"

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.8.3"
          target: desktop
          cache: true
          install-deps: true

      - name: Verify toolchains
        run: |
          cmake --version
          ninja --version
          swift --version
          i686-w64-mingw32-gcc --version
          i686-w64-mingw32-g++ --version

      - name: Configure Linux Clang
        if: matrix.cpp_compiler == 'clang++'
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -G Ninja
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}"
          -DCMAKE_BUILD_TYPE=Release
          -DSOA_REQUIRE_ALICIA_LOG_HOOK=ON
          -DBUILD_TESTING=ON

      - name: Build Linux Clang
        if: matrix.cpp_compiler == 'clang++'
        run: cmake --build "${{ github.workspace }}/build" --parallel

      - name: Test Linux Clang
        if: matrix.cpp_compiler == 'clang++'
        working-directory: ${{ github.workspace }}/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Build Linux AppImage
        if: matrix.cpp_compiler == 'g++'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          SOA_UPDATE_SIGNING_KEY_B64: ${{ secrets.SOA_UPDATE_SIGNING_KEY_B64 }}
          SOA_UPDATE_PUBLIC_KEY_HEX: ${{ vars.SOA_UPDATE_PUBLIC_KEY_HEX }}
        run: ./packaging/linux/build-appimage.sh

      - name: Verify Linux AppImage
        if: matrix.cpp_compiler == 'g++'
        run: |
          output="$(find "${{ github.workspace }}/packaging/linux" -maxdepth 1 -type f -name 'Story_Of_Alicia_Launcher_*_x86_64.AppImage' -print -quit)"
          if [ ! -s "$output" ]; then
            echo "::error::build-appimage.sh did not produce the expected AppImage."
            exit 1
          fi
          chmod +x "$output"
          file "$output"
          ls -lh "$output"

      - name: Validate AppImage in clean Ubuntu container
        if: matrix.cpp_compiler == 'g++'
        run: |
          set -euo pipefail
          output="$(find "${{ github.workspace }}/packaging/linux" -maxdepth 1 -type f -name 'Story_Of_Alicia_Launcher_*_x86_64.AppImage' -print -quit)"
          extract_root="$RUNNER_TEMP/soa-appimage-extract"
          mkdir -p "$extract_root"
          (
            cd "$extract_root"
            "$output" --appimage-extract >/dev/null
          )
          docker run --rm -i \
            -v "$extract_root/squashfs-root:/app:ro" \
            ubuntu:22.04 bash -s <<'CHECK_APPIMAGE'
          set -euo pipefail
          swift_core="$(find /app -name 'libswiftCore.so*' -print -quit)"
          if [ -z "$swift_core" ]; then
            echo "libswiftCore.so is not bundled in the AppImage." >&2
            exit 1
          fi
          failed=0
          while IFS= read -r -d '' item; do
            dependencies="$(env -u LD_LIBRARY_PATH -u LD_PRELOAD ldd "$item" 2>&1 || true)"
            if grep -q '=> not found' <<< "$dependencies"; then
              echo "Unresolved dependencies in clean Ubuntu 22.04: $item" >&2
              grep '=> not found' <<< "$dependencies" >&2
              failed=1
            fi
          done < <(find /app -type f \( -perm /111 -o -name '*.so' -o -name '*.so.*' \) -print0)
          exit "$failed"
          CHECK_APPIMAGE

      - name: Upload Linux AppImage
        if: matrix.cpp_compiler == 'g++'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: soa-launcher-linux-appimage
          path: |
            ${{ github.workspace }}/packaging/linux/Story_Of_Alicia_Launcher_*_x86_64.AppImage
            ${{ github.workspace }}/packaging/linux/linux_launcher_version.json
            ${{ github.workspace }}/packaging/linux/linux_launcher_version.json.sig
            ${{ github.workspace }}/packaging/linux/linux_launcher_versions.json
            ${{ github.workspace }}/packaging/linux/linux_launcher_versions.json.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7