name: Build macOS (Intel)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-macos-intel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS (Intel)
    if: ${{ github.event_name == 'workflow_dispatch' || (vars.SOA_ACTIONS_ENABLED != 'false' && vars.SOA_MACOS_INTEL_ENABLED != 'false') }}
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install macOS build dependencies
        run: brew install cmake ninja mingw-w64

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.8.3"
          target: desktop
          cache: true
          install-deps: true

      - name: Verify toolchains
        run: |
          cmake --version
          ninja --version
          swift --version
          i686-w64-mingw32-gcc --version
          i686-w64-mingw32-g++ --version

      - name: Configure macOS
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -G Ninja
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          -DSOA_REQUIRE_ALICIA_LOG_HOOK=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Detect macOS signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "SOA_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "SOA_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ] && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            echo "SOA_NOTARIZATION_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "SOA_NOTARIZATION_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: env.SOA_SIGNING_ENABLED == '1'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/soa-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PY_CERT'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "developer-id.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE"]))
          PY_CERT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "SOA_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: env.SOA_NOTARIZATION_ENABLED == '1'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY_NOTARY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "AuthKey.p8").write_bytes(
              base64.b64decode(os.environ["NOTARY_KEY"]))
          PY_NOTARY
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Bundle and sign macOS application
        working-directory: ${{ github.workspace }}/build
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          COURIER="$APP/Contents/Frameworks/libsoa_network.dylib"
          test -f "$COURIER"
          test -f "$APP/Contents/Resources/soa-launcher.icns"
          test -s "$APP/Contents/Resources/alicia-log-hook/SoaAliciaLogInjector.exe"
          test -s "$APP/Contents/Resources/alicia-log-hook/SoaAliciaLogHook.dll"
          test -s "$APP/Contents/Resources/alicia-log-hook/UPSTREAM.md"
          test -s "$APP/Contents/Resources/alicia-log-hook/MINHOOK_LICENSE.txt"
          file "$APP/Contents/Resources/alicia-log-hook/SoaAliciaLogInjector.exe" | grep -F 'PE32 executable'
          file "$APP/Contents/Resources/alicia-log-hook/SoaAliciaLogHook.dll" | grep -F 'PE32 executable'
          case " $(lipo -archs "$APP/Contents/MacOS/soa_launcher") " in
            *" x86_64 "*) ;;
            *) echo "Launcher is missing requested architecture x86_64." >&2; exit 1 ;;
          esac
          test "$(otool -D "$COURIER" | tail -n 1)" = "@rpath/libsoa_network.dylib"
          otool -L "$APP/Contents/MacOS/soa_launcher" | grep -F "@rpath/libsoa_network.dylib"
          if otool -L "$APP/Contents/MacOS/soa_launcher" | grep -F "${{ github.workspace }}"; then
            exit 1
          fi
          macdeployqt "$APP" -verbose=1
          if [ "$SOA_SIGNING_ENABLED" = "1" ]; then
            "$GITHUB_WORKSPACE/packaging/macos/sign-app.sh" \
              "$APP" \
              "$SIGNING_IDENTITY" \
              "$GITHUB_WORKSPACE/packaging/macos/entitlements.plist"
            if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
              NOTARY_ZIP="$RUNNER_TEMP/soa-launcher-x86_64.zip"
              ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
              xcrun notarytool submit "$NOTARY_ZIP" \
                --key "$RUNNER_TEMP/AuthKey.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --wait
              xcrun stapler staple "$APP"
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=4 "$APP"
            fi
          fi

      - name: Package macOS DMG
        working-directory: ${{ github.workspace }}/build
        run: |
          set -euo pipefail
          cpack -G DragNDrop --verbose
          test -s "Story_Of_Alicia-x86_64.dmg"

      - name: Sign and notarize macOS DMG
        if: env.SOA_SIGNING_ENABLED == '1'
        working-directory: ${{ github.workspace }}/build
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="Story_Of_Alicia-x86_64.dmg"
          test -s "$DMG"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=4 "$DMG"
          MOUNT="$RUNNER_TEMP/soa-dmg-x86_64"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          BUNDLED_APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$BUNDLED_APP"
          codesign --verify --deep --strict --verbose=4 "$BUNDLED_APP"
          if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
            spctl --assess --type execute --verbose=4 "$BUNDLED_APP"
          fi
          hdiutil detach "$MOUNT"
          trap - EXIT
          if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          else
            echo "The DMG is signed but was not notarized because notarization credentials are absent."
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: soa-launcher-macos-x86_64-dmg
          path: ${{ github.workspace }}/build/Story_Of_Alicia-x86_64.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${SOA_SIGNING_KEYCHAIN:-}" ] && [ -f "$SOA_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SOA_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"