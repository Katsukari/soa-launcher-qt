name: Build macOS and Linux

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-22.04
            cpp_compiler: g++
          - name: Linux Clang
            os: ubuntu-22.04
            cpp_compiler: clang++
          - name: macOS Apple Silicon
            os: macos-15
            cpp_compiler: clang++
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            cpp_compiler: clang++
            arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@65540b95f51493d65f5e59e97dcef9629ddf11bf
        with:
          swift-version: "6.0"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            desktop-file-utils \
            file \
            libfuse2 \
            libgl1-mesa-dev \
            libwayland-dev \
            libxcb-cursor0 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            ninja-build \
            patchelf \
            wget

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: "6.8.3"
          target: desktop
          cache: true
          install-deps: true

      - name: Verify toolchains
        run: |
          cmake --version
          ninja --version
          swift --version

      - name: Configure
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -G Ninja
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

      - name: Build Linux AppImage
        if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: ./packaging/build-appimage.sh

      - name: Upload Linux AppImage
        if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soa-launcher-linux-appimage
          path: ${{ github.workspace }}/packaging/Story_Of_Alicia-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Detect macOS signing credentials
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ]; then
            echo "SOA_SIGNING_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "SOA_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
          fi
          if [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && [ -n "$SIGNING_IDENTITY" ] && [ -n "$NOTARY_KEY" ] && [ -n "$NOTARY_KEY_ID" ] && [ -n "$NOTARY_ISSUER_ID" ]; then
            echo "SOA_NOTARIZATION_ENABLED=1" >> "$GITHUB_ENV"
          else
            echo "SOA_NOTARIZATION_ENABLED=0" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        if: runner.os == 'macOS' && env.SOA_SIGNING_ENABLED == '1'
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/soa-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "developer-id.p12").write_bytes(
              base64.b64decode(os.environ["CERTIFICATE"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "SOA_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: runner.os == 'macOS' && env.SOA_NOTARIZATION_ENABLED == '1'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["RUNNER_TEMP"], "AuthKey.p8").write_bytes(
              base64.b64decode(os.environ["NOTARY_KEY"]))
          PY
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Bundle and sign macOS application
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/build
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          COURIER="$APP/Contents/Frameworks/libsoa_network.dylib"
          test -f "$COURIER"
          test -f "$APP/Contents/Resources/soa-launcher.icns"
          test "$(otool -D "$COURIER" | tail -n 1)" = "@rpath/libsoa_network.dylib"
          otool -L "$APP/Contents/MacOS/soa_launcher" | grep -F "@rpath/libsoa_network.dylib"
          if otool -L "$APP/Contents/MacOS/soa_launcher" | grep -F "${{ github.workspace }}"; then
            exit 1
          fi
          macdeployqt "$APP" -verbose=1
          if [ "$SOA_SIGNING_ENABLED" = "1" ]; then
            "$GITHUB_WORKSPACE/packaging/macos/sign-app.sh" \
              "$APP" \
              "$SIGNING_IDENTITY" \
              "$GITHUB_WORKSPACE/packaging/macos/entitlements.plist"
            if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
              NOTARY_ZIP="$RUNNER_TEMP/soa-launcher-${{ matrix.arch }}.zip"
              ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
              xcrun notarytool submit "$NOTARY_ZIP" \
                --key "$RUNNER_TEMP/AuthKey.p8" \
                --key-id "$NOTARY_KEY_ID" \
                --issuer "$NOTARY_ISSUER_ID" \
                --wait
              xcrun stapler staple "$APP"
              xcrun stapler validate "$APP"
              spctl --assess --type execute --verbose=4 "$APP"
            fi
          fi

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/build
        run: cpack -G DragNDrop --verbose

      - name: Sign and notarize macOS DMG
        if: runner.os == 'macOS' && env.SOA_SIGNING_ENABLED == '1'
        working-directory: ${{ github.workspace }}/build
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG="$(find . -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$DMG"
          codesign --verify --strict --verbose=4 "$DMG"
          MOUNT="$RUNNER_TEMP/soa-dmg-${{ matrix.arch }}"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          BUNDLED_APP="$(find "$MOUNT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$BUNDLED_APP"
          codesign --verify --deep --strict --verbose=4 "$BUNDLED_APP"
          if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
            spctl --assess --type execute --verbose=4 "$BUNDLED_APP"
          fi
          hdiutil detach "$MOUNT"
          trap - EXIT
          if [ "$SOA_NOTARIZATION_ENABLED" = "1" ]; then
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$DMG"
            xcrun stapler validate "$DMG"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          else
            echo "The DMG is signed but was not notarized because notarization credentials are absent."
          fi

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: soa-launcher-macos-${{ matrix.arch }}-dmg
          path: ${{ github.workspace }}/build/*.dmg
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SOA_SIGNING_KEYCHAIN:-}" ] && [ -f "$SOA_SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SOA_SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
