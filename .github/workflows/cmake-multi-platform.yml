name: Build (macOS & Linux)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-22.04
            cpp_compiler: g++
          - name: Linux Clang
            os: ubuntu-22.04
            cpp_compiler: clang++
          - name: macOS Apple Silicon
            os: macos-15
            cpp_compiler: clang++
            arch: arm64
          - name: macOS Intel
            os: macos-15-intel
            cpp_compiler: clang++
            arch: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install Swift
        if: runner.os == 'Linux'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Verify Swift
        run: swift --version

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            desktop-file-utils \
            file \
            libfuse2 \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            patchelf \
            wget

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          target: desktop
          cache: true
          install-deps: true

      - name: Configure
        run: >
          cmake
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build"
          -G Ninja
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build "${{ github.workspace }}/build" --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure



      - name: Build Linux AppImage
        if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: |
          chmod +x packaging/build-appimage.sh
          ./packaging/build-appimage.sh

      - name: Upload Linux AppImage
        if: runner.os == 'Linux' && matrix.cpp_compiler == 'g++'
        uses: actions/upload-artifact@v4
        with:
          name: soa-launcher-linux-appimage
          path: ${{ github.workspace }}/packaging/Story_Of_Alicia-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Bundle Qt frameworks and verify Courier (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/build
        run: |
          set -euo pipefail
          APP="$(find . -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "No macOS application bundle was produced."
            exit 1
          fi

          COURIER="$APP/Contents/Frameworks/libsoa_network.dylib"
          test -f "$COURIER"
          test -f "$APP/Contents/Resources/soa-launcher.icns"
          COURIER_ID="$(otool -D "$COURIER" | tail -n 1)"
          APP_LINKS="$(otool -L "$APP/Contents/MacOS/soa_launcher")"
          echo "$COURIER_ID"
          echo "$APP_LINKS"
          test "$COURIER_ID" = "@rpath/libsoa_network.dylib"
          echo "$APP_LINKS" | grep -F "@rpath/libsoa_network.dylib"
          if echo "$APP_LINKS" | grep -F "${{ github.workspace }}"; then
            echo "The macOS bundle still contains an absolute build-tree dylib path."
            exit 1
          fi
          macdeployqt "$APP" -verbose=1

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        working-directory: ${{ github.workspace }}/build
        run: cpack -G DragNDrop --verbose

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: soa-launcher-macos-${{ matrix.arch }}-dmg
          path: ${{ github.workspace }}/build/*.dmg
          if-no-files-found: error
